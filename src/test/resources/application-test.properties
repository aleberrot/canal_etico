spring.datasource.url=jdbc:h2:mem:context;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
app.notifications.enabled=false
app.notifications.recipients=synthetic@example.invalid
app.clients.mathiesen.enabled=false
app.demo-companies.enabled=false
app.storage.type=local
ADMIN_PASSWORD=integration-only
