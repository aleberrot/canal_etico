spring.application.name=canal-etico

spring.jpa.hibernate.ddl-auto=update

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
app.storage.type=${STORAGE_TYPE:local}

app.storage.r2.account-id=${R2_ACCOUNT_ID:}
app.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.storage.r2.bucket=${R2_BUCKET:}
app.storage.r2.endpoint=${R2_ENDPOINT:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLED:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=${SCHEMA_MIGRATION_MODE:never}
spring.sql.init.schema-locations=classpath:db/20261124_observaciones.sql
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=false
spring.jackson.time-zone=UTC
app.notifications.recipients=${NOTIFICATION_RECIPIENTS:}
app.notifications.admin-url=${NOTIFICATION_ADMIN_URL:https://canaletico.absoftwareworks.com/admin}
app.notifications.enabled=${NOTIFICATIONS_ENABLED:true}
app.notifications.poll-ms=${NOTIFICATIONS_POLL_MS:30000}
app.notifications.from=${NOTIFICATION_FROM:${spring.mail.username:}}
spring.mail.host=${SMTP_HOST:${MAIL_HOST:}}
spring.mail.port=${SMTP_PORT:${MAIL_PORT:587}}
spring.mail.username=${SMTP_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SMTP_PASSWORD:${MAIL_PASSWORD:}}
